<head>
    <meta charset="UTF-8">

<body>
  <main>
    <!-- Nombre de la empresa -->
    <section id="galeria" class="container">
      <div class="text-center pt-5">
        <h1 id="nombreLugar"></h1>
      </div>

      <div class="contenedorImagen">
        <div class="imagenListing">
          <img id="imagenLugar" src="" alt="">
        </div>
      </div>
    </section>

    <hr>
    <h2>Conoce más sobre nosotros</h2>
    <hr>
    <div class="card tarjeta-descripcion">
      <!-- <div class="card-header">Una pequeña descripción </div> -->
      <div class="card-body">
        <h5 class="card-title" id="tituloh5">Una breve descripción</h5>
        <p class="card-text" id="descripcionLugares"></p>
      </div>
    </div>

    <div class="contenedor-dos">
      <div class="card text-bg-light mb-3" style="max-width: 18rem;">
        <!-- <div class="card-header">Una pequeña descripción </div> -->
        <div class="card-body" id="tarjetaReseña">
          <h5 class="card-title">Información adicional</h5>
          <p class="card-text">
          </p>
          <h6>Dirección y ubicación</h6>
          <p class="direccion">
            <span id="datoCalle"></span>,
            <span id="datoNumero"></span>,
            <span id="datoColonia"></span>,
            <span id="datoMunicipio"></span>,
            <span id="datoEstado"></span>,
            <span id="datoCp"></span>.
          </p>
          <h6>Contacto y teléfono</h6>
          <p class="direccion">
            <span>Teléfono:</span>
            <span id="datoTel"></span>
            <span>Correo electrónico:</span>
            <span id="datoEmail"></span>
            <span>Sitio web:</span>
            <span id="datoSitio"></span>
            <!-- <span>Horarios de atención:</span> -->
            <span id="datoHorario"></span>
          </p>

          <!-- <h6>Horarios de atención</h6> -->
          <!-- <p class="card-text" id="datoHorario"></p> -->
        </div>
      </div>
            <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3762.463935171718!2d-99.140920925087!3d19.435554440587175!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1f92cf20ea183%3A0x2cf06c7f4a8f31ff!2sMIDE%2C%20Museo%20Interactivo%20de%20Econom%C3%ADa!5e0!3m2!1ses-419!2smx!4v1738702266101!5m2!1ses-419!2smx"
        width="600" height="400" style="border:0;" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="contenedor-dos">
        <div class="card text-bg-light mb-3" style="max-width: 18rem;">
          <!-- <div class="card-header">Una pequeña descripción </div> -->
          <div class="card-body" id="tarjetaReseña">
            <h5 class="card-title">Rating</h5>
            <p class="card-text" id="datoRatin"></p>
       <!-- Modal de reseña -->
       <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal"
       data-bs-whatever="@mdo">En construcción, no tocar</button>
     <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
       aria-hidden="true">
       <div class="modal-dialog">
         <div class="modal-content">
           <div class="modal-header">
             <h1 class="modal-title fs-5" id="exampleModalLabel">Cuéntanos tu experiencia</h1>
             <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
           </div>
           <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Nombre del lugar:</label>
                <input type="text" class="form-control" id="recipient-name">
              </div>

              <div class="form-group">
                <label>¿Cómo calificarías tu experiencia en este destino?</label>
                <div class="star-rating" data-category="experiencia">
                  <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                    name="experienciaDestino" id="dest-exp-1" value="1" style="display:none">
                  <label class="form-check-label" for="dest-exp-1">
                    <i class="bi bi-star-fill"></i>
                  </label>

                  <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                          name="experienciaDestino" id="dest-exp-2" value="2" style="display:none">
                        <label class="form-check-label" for="dest-exp-2">
                          <i class="bi bi-star-fill"></i>
                        </label>
                        <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                          name="experienciaDestino" id="dest-exp-3" value="3" style="display:none">
                        <label class="form-check-label" for="dest-exp-3">
                          <i class="bi bi-star-fill"></i>
                        </label>

                        <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                        name="experienciaDestino" id="dest-exp-4" value="4" style="display:none">
                      <label class="form-check-label" for="dest-exp-4">
                        <i class="bi bi-star-fill"></i>
                      </label>
                      <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                        name="experienciaDestino" id="dest-exp-5" value="5" style="display:none" checked>
                      <label class="form-check-label" for="dest-exp-5">
                        <i class="bi bi-star-fill"></i>
                      </label>

                    </div>

                    <div class="mb-3">
                      <label for="message-text" class="col-form-label">Descripción:</label>
                      <textarea class="form-control" id="message-text"></textarea>
                    </div>
                  </form>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-primary">Enviar</button>
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3762.463935171718!2d-99.140920925087!3d19.435554440587175!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1f92cf20ea183%3A0x2cf06c7f4a8f31ff!2sMIDE%2C%20Museo%20Interactivo%20de%20Econom%C3%ADa!5e0!3m2!1ses-419!2smx!4v1738702266101!5m2!1ses-419!2smx" width="600" height="400" style="border:0;" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe> -->
      </div>
      <!-- <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal"
      data-bs-whatever="@mdo" disabled>No tocar, funcionaldad en construcción</button> -->
      <!-- <a href="/pages/dummy pages/dummyUserPage.html" class="btn btn-secondary mt-3" id="button1"  disabled>No tocar,
        funcionalidad en construcción</a> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
