<body>
  <main>

   
    <br>
    <div class="container">
      
        <div class="card-body p-0">
          <!-- Imagen principal -->
           

          <div class="row align-items-center">
            <div class="col-lg-4 order-lg-1 order-2">
              <div class="d-flex align-items-center justify-content-around m-4">
                <div class="form-group">
                  <label>Ranking</label>
                  <div class="star-rating" data-category="ranking">
                    <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                      name="rankingDestino" id="dest-rank-1" value="1" style="display:none">
                    <label class="form-check-label" for="dest-rank-1">
                      <i class="bi bi-star-fill"></i>
                    </label>
                    <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                      name="rankingDestino" id="dest-rank-2" value="2" style="display:none">
                    <label class="form-check-label" for="dest-rank-2">
                      <i class="bi bi-star-fill"></i>
                    </label>
                    <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                      name="rankingDestino" id="dest-rank-3" value="3" style="display:none">
                    <label class="form-check-label" for="dest-rank-3">
                      <i class="bi bi-star-fill"></i>
                    </label>
                    <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                      name="rankingDestino" id="dest-rank-4" value="4" style="display:none">
                    <label class="form-check-label" for="dest-rank-4">
                      <i class="bi bi-star-fill"></i>
                    </label>
                    <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio"
                      name="rankingDestino" id="dest-rank-5" value="5" style="display:none" checked>
                    <label class="form-check-label" for="dest-rank-5">
                      <i class="bi bi-star-fill"></i>
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-4 mt-n3 order-lg-2 order-1">
              <div class="mt-n5">
                <div class="d-flex align-items-center justify-content-center mb-2">
                  <div class="linear-gradient d-flex align-items-center justify-content-center rounded-circle" style="width: 110px; height: 110px;">
                    <div class="border border-4 border-white d-flex align-items-center justify-content-center rounded-circle overflow-hidden" style="width: 100px; height: 100px;">
                      <img id="imagenLugar" src="" alt="" class="w-100 h-100 img-fluid">
                    </div>
                  </div>
                </div>
                <div class="text-center">
                  <h5 class="fs-5 mb-3 fw-semibold card-title" id="nombreLugar"></h5>
                  <p class="mb-0 fs-4"></p>
                </div>
              </div>
            </div>
            <div class="col-lg-4 order-last">
              <ul class="list-unstyled d-flex align-items-center justify-content-center justify-content-lg-start my-3 gap-3">
                <li><button class="btn btn-primary">Añadir reseña</button></li>
              </ul>
            </div>
          </div>
        </div>
        <div class="tab-content" id="pills-tabContent">
          <div class="tab-pane fade show active" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab" tabindex="0">
            <div class="row">
              <div class="col-lg-4">
               
                <div class="card-body tarjetaresena" id="tarjetaReseña">
                  <br>
                  <h4 class="card-title fw-semibold mb-3" id="tituloh5">Conócenos</h4>
                  <p class="card-text" id="descripcionLugares"></p>
                  <br>
                  <ul class="list-unstyled mb-0">
                      <li class="infolugar d-flex align-items-center gap-3 mb-2">
                          <i class="bi bi-envelope-fill icono"></i>
                          <span id="datoEmail"></span>
                      </li>
                      <li class="d-flex align-items-center gap-3 mb-2">
                          <i class="bi bi-telephone-fill icono"></i>
                          <span id="datoTel"></span>
                      </li>
                      <li class="d-flex align-items-center gap-3 mb-2">
                          <i class="bi bi-geo-alt-fill icono"></i>
                          <p class="direccion">
                              <span id="datoCalle"></span>,
                              <span id="datoNumero"></span>,
                              <span id="datoColonia"></span>,
                              <span id="datoMunicipio"></span>,
                              <br>
                              <span id="datoEstado"></span>,
                              <span id="datoCp"></span>.
                          </p>
                      </li>
                      <li class="d-flex align-items-center gap-3 mb-2">
                          <i class="bi bi-globe icono"></i>
                          <span id="datoSitio"></span>
                      </li>
                      <li class="d-flex align-items-center gap-3 mb-2">
                          <i class="bi bi-clock icono"></i>
                          <span id="datoHorario"></span>
                      </li>
                  </ul>
              </div>
             
              </div>
              <div class="col-lg-8">
                
                <div class="card-body border-bottom">
                  <div class="iframe-container">
                      <iframe

                          loading="lazy"
                          referrerpolicy="no-referrer-when-downgrade"
                          class="iframe-responsive">
                      </iframe>
                  </div>
              </div>
                
              </div>
            </div>
          </div>
        </div>
