<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/inicio.css">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../../styles/forms/reseñas.css">

    <title>Reseñas</title>
</head>
<body>

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@mdo">¡Haz una reseña!</button>
    <!-- <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@fat">Open modal for @fat</button>
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@getbootstrap">Open modal for @getbootstrap</button> -->

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Cuéntanos tu experiencia</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Nombre del lugar:</label>
                <input type="text" class="form-control" id="recipient-name">
              </div>
            <div class="form-group">
                <label>¿Cómo calificarías tu experiencia en este destino?</label>
                <div class="star-rating" data-category="experiencia">
                    <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio" name="experienciaDestino" id="dest-exp-1" value="1" style="display:none">
                    <label class="form-check-label" for="dest-exp-1">
                        <i class="bi bi-star-fill"></i>
                    </label>
                        <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio" name="experienciaDestino" id="dest-exp-2" value="2" style="display:none">
                    <label class="form-check-label" for="dest-exp-2">
                        <i class="bi bi-star-fill"></i>
                    </label>
                        <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio" name="experienciaDestino" id="dest-exp-3" value="3" style="display:none">
                    <label class="form-check-label" for="dest-exp-3">
                      <i class="bi bi-star-fill"></i>
                    </label>
                        <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio" name="experienciaDestino" id="dest-exp-4" value="4" style="display:none">
                    <label class="form-check-label" for="dest-exp-4">
                        <i class="bi bi-star-fill"></i>
                    </label>
                        <input class="bsu-form-destination-exp-option bsu-form-subfield form-check-input" type="radio" name="experienciaDestino" id="dest-exp-5" value="5" style="display:none" checked>
                    <label class="form-check-label" for="dest-exp-5">
                        <i class="bi bi-star-fill"></i>
                    </label>
                 </div>
            </div>

              <div class="mb-3">
                <label for="message-text" class="col-form-label">Descripción:</label>
                <textarea class="form-control" id="message-text"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary">Enviar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
