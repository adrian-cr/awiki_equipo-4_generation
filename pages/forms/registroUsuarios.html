<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Log in-Awiki</title>
  <link rel="stylesheet" href="../../styles/forms/registroUsuarios.css">
  <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />  
</head>
<body>
    <main> 
      <h1>Awiki te ayuda a conectar y descubrir tus nuevos destinos turísticos</h1>
          <div class="container">
              <div class="formulario1">
                  <h2>Inicia sesión</h2>
                  <form id="formulario1" class="needs-validation">
                      <div class="col-mb-4">
                        <label for="formInicioSesion" class="form-label">Correo electrónico</label>
                        <input type="text" class="form-control" id="correoSesion" placeholder="Correo electrónico">
                        <div class="invalid-feedback">Por favor, ingresa una dirección valida</div> 
                        <div class="valid-feedback">Nice</div>
                      </div>
                      <div class="col-mb-4">
                      <label for="inputPassword4" class="form-label">Contraseña</label>
                      <input type="password" class="form-control" id="contraseñaSesion">
                      <div class="invalid-feedback">Contraseña incorrecta</div> 
                      <div class="valid-feedback">Nice</div>
                    </div>
                    <input type="submit" id="botonSesion" value="Inicia sesión">
                    <p class="warnings" id="warnings"></p> 
                  </form>
              </div> 
            
              <div class="formulario">
                  <h2>Regístrate</h2>
                  <h3>¡Es gratis y cualquiera puede hacerlo!</h3>
                  <form id="formulario2" class="form-registro">
                    <div class="mb-3">
                        <label for="formNombre" class="form-label">Nombre</label>
                        <input name="campoNombre" type="text" class="form-control" id="formNombre" placeholder="Nombre">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3" id="grupo_nombre">
                        <label for="formApellido" class="form-label">Apellido</label>
                        <input name="campoApellido"type="text" class="form-control" id="formApellido" placeholder="Apellido">
                        <div class="invalid-feedback"></div>
                      </div>
                      <div class="mb-3">
                        <label for="formCorreo" class="form-label">Correo electrónico</label>
                        <input name="campoCorreo"type="text" class="form-control" id="formCorreo" placeholder="Correo electrónico">
                        <div class="invalid-feedback"></div>
                      </div>
                      <div class="mb-3">
                        <label for="inputContraseña" class="form-label">Contraseña</label>
                        <input name="campoContraseña"type="password" class="form-control" id="inputContraseña">
                        <div class="invalid-feedback"></div>
                      </div>
                      <div class="mb-3">
                        <label for="inputConfirmar" class="form-label">Confirmar contraseña</label>
                        <input name="campoConfirmar"type="password" class="form-control" id="inputConfirmar">
                        <div class="invalid-feedback"></div>
                      </div>
                      <div class="mb-3">
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" id="gridCheck1">
                          <label class="form-check-label" for="gridCheck1">
                            Acepto los términos y condiciones
                          </label>
                        </div>
                      </div>
                       <input type="submit" id="botonRegistro" value="Regístrate">
                        <p class="warnings" id="advertencia"></p> 
                    

                  </form>
              </div>
          </div>
      </body>
      </html>
      


    </main>





  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    >
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../js/basesDatos/registroUsuario.js"></script> 
  <script type="module" src="../../js/inyeccionHTML.js"></script>  
  <script type="module" src="../../js/validacionRegistro.js" ></script>
  
</body>
</html>
